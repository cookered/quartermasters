<!DOCTYPE html>
<html>
<head>
  <title>Troop 89 Quartermasters Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Times New Roman, serif;
      background-color: #11bbff;
      color: #007700;
      text-align: center;
    }
    header, footer {
      background-color: red;
      color: yellow;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    header img {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }
    header h1 {
      font-size: 2em;
      word-break: break-word;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.1em;
        margin-left: 0;
        text-align: center;
      }
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      width: 100%;
      height: calc(100vh - 120px);
    }

    #login-form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      height: 100%;
      width: 400px;
      margin: auto;
      align-self: stretch;
    }
    #login-form input {
      width: 150px;
      padding: 10px;
      margin-bottom: 10px;
    }
    #login-form input[type="submit"] {
      padding: 6px 10px;
    }
    .g_id_signin {
      max-width: 400px;
      margin: 0 auto;
    }
    #err-form {
      color: red;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='favicon.png') }}">
    <h1>Troop 89 quartermasters dashboard</h1>
  </header>

  <main>
    <form id="login-form">
      <h3>Please sign in to continue</h3>
      <div id="g_id_onload"
           data-client_id="225463699824-sjfadl4s88pamvc29qr1ubandd6mp1h9.apps.googleusercontent.com"
           data-callback="onGoogleLogin"
           data-auto_prompt="false"
           data-itp_support="true"></div>
      <div class="g_id_signin" data-type="standard"></div>
      <h4>or</h4>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="QM pin" required>
      <input type="submit" value="Login">
      <p id="err-form">
        Invalid email/password. Please email <a href="mailto:mittnevaan@gmail.com">mittnevaan@gmail.com</a>
        if you tried to log in with Google but your email is not in the database, or check your credentials if you manually entered them.
      </p>
    </form>
  </main>

  <footer>Powered by Koyeb</footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>

  <script>
    $("#login-form").submit(function(event){
      event.preventDefault();
      if ($("#password").val() !== "troop89isthegoat") {
        console.error("Invalid password");
        $("#err-form").show();
        return;
      }
      const email = $("#email").val();
      const thing = execute("SELECT * FROM users WHERE email = %s", [email]);
      thing.then(result => {
        if (result && result.length > 0) {
          console.log("✅ Manual user authenticated:", result);
          $("#login-form").hide();
        } else {
          console.error("No user found with this email.");
          $("#err-form").show();
        }
      });
    });

    function onGoogleLogin(response) {
      const credential = response.credential;
      const payload = JSON.parse(atob(credential.split(".")[1]));
      const thing = execute("SELECT * FROM users WHERE email = %s", [payload.email]);
      thing.then(result => {
        if (result && result.length > 0) {
          console.log("✅ Google user authenticated:", result);
          $("#login-form").hide();
        } else {
          console.error("No user found with this email.");
          $("#err-form").show();
        }
      });
    }
  </script>
</body>
</html>
