<!DOCTYPE html>
<html>
<head>
  <title>Troop 89 Quartermasters Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Times New Roman, serif;
      background-color: #11bbff;
      color: #007700;
      text-align: center;
    }
    header, footer {
      background-color: red;
      color: yellow;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    header img {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      width: 100%;
      height: calc(100vh - 120px);
      position: relative; /* for absolute children */
    }
    #login-form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
      height: 100%;
      margin: auto;
    }
    #login-form input {
      width: 150px;
      padding: 10px;
      margin-bottom: 10px;
    }
    #err-form { color: red; display: none; }
    #dashboard { display: none; margin-top: 20px; }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 999;
      display: none;
    }
    #qr-cont {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 350px; height: 375px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #qr-reader {
      width: 300px;
      height: 300px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo">
    <h1>Troop 89 Quartermasters Dashboard</h1>
  </header>
  <main>
    <form id="login-form">
      <h3>Please sign in to continue</h3>
      <div id="g_id_onload"
           data-client_id="225463699824-sjfadl4s88pamvc29qr1ubandd6mp1h9.apps.googleusercontent.com"
           data-callback="onGoogleLogin"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard"></div>
      <h4>or</h4>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="QM pin" required>
      <input type="submit" value="Login">
      <p id="err-form">
        Invalid credentials. Please try again.
      </p>
    </form>
    <div id="dashboard">
      <button onclick="checkout()">Checkout item</button>
    </div>
    <div id="overlay"></div>
    <div id="qr-cont">
      <h4>Scan QR code of an item</h4>
      <div id="qr-reader"></div>
    </div>
  </main>
  <footer>Powered by Koyeb</footer>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    $("#dashboard").hide();
    $("#qr-cont").hide();
    $("#overlay").hide();
    $("#login-form").submit(function(e) {
      e.preventDefault();
      if ($("#password").val() !== "troop89isthegoat") {
        $("#err-form").show();
        return;
      }
      $("#login-form").hide();
      $("#dashboard").show();
    });
    function onGoogleLogin(response) {
      $("#login-form").hide();
      $("#dashboard").show();
    }
    function checkout() {
      scan(function(data) {
        console.log("Scanned data:", data);
        execute("SELECT * FROM inventory WHERE id = %s", [data])
          .then(res => {
            if (!res || res.length === 0) {
              alert("INVALID QR CODE");
              return;
            }
            const item = res[0];
            if (confirm("Checkout item " + (item.name || "[unnamed item]") + "?")) {
              alert("CHECKING OUT ITEM");
            }
          })
          .catch(err => {
            console.error("Error during DB query:", err);
            alert("An error occurred checking the item.");
          });
      });
    }
  </script>
</body>
</html>
